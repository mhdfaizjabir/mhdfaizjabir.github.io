<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Writing by Mohammad Faiz Jabir on applied AI, agents, and the systems that keep them reliable.">
  <title>Writing — Mohammad Faiz Jabir</title>
  <link rel="icon" type="image/png" href="../favicon-32x32.png">
  <style>
    :root {
      --ink: #121212;
      --muted: #646464;
      --soft: #f6f5f2;
      --line: #e8e4dc;
      --accent: #1f6f68;
      --accent-soft: #e8f2ef;
      --page-bg: #fffdf9;
      --shadow: rgba(20, 20, 20, 0.13);
      --blue-link: #3978ff;
      --max: 760px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 56px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      border-bottom: 1px solid transparent;
    }

    .nav a:hover {
      border-bottom-color: currentColor;
    }

    .nav a.current {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 3.2rem);
      line-height: 1;
      font-weight: 820;
      margin-bottom: 14px;
    }

    .intro {
      max-width: 56ch;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.1rem);
      margin-bottom: 52px;
    }

    .posts {
      display: grid;
      gap: 30px;
      border-top: 1px solid var(--line);
      padding-top: 30px;
    }

    .post {
      display: grid;
      gap: 6px;
    }

    .post .date {
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .post h2 {
      font-size: 1.3rem;
      font-weight: 720;
    }

    .post h2 a:hover {
      border-bottom: 1px solid currentColor;
    }

    .post p {
      color: var(--muted);
      max-width: 62ch;
    }

    .empty {
      border-top: 1px solid var(--line);
      padding-top: 30px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="Site header">
      <nav class="nav" aria-label="Main navigation">
        <a href="../index.html#work">Work</a>
        <a href="../index.html#projects">Projects</a>
        <a href="../index.html#skills">Skills</a>
        <a href="index.html" class="current">Writing</a>
      </nav>
    </header>

    <h1>Writing</h1>
    <p class="intro">Notes on applied AI, agents, and the systems that keep them reliable once a model is in the loop.</p>

    <div class="empty">
      First post is in the works. Check back soon.
    </div>
  </main>
</body>
</html>
